name: Lab 4 validation
on:
  push:
    paths:
      - 'lb4/**'
      - '.github/workflows/lb4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: lb4
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Unit tests
        run: dotnet test ds-2024.sln -c Release
      - name: Start web, workers and two event subscribers
        run: ./scripts/start.ps1 -Workers 2 -ProcessingDelayMs 250
      - name: Async processing, pub/sub, subscriber recovery and web failover
        run: ./scripts/test.ps1 -TestAsync -TestEvents -TestFailover
      - name: Logs
        if: always()
        run: docker compose logs --no-color --tail 150
      - name: Stop
        if: always()
        run: ./scripts/stop.ps1
