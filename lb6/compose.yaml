name: rp-lb6

x-app: &app
  build:
    context: .
    dockerfile: Valuator/Dockerfile
  environment: &environment
    DB_MAIN: redis-main:6379
    DB_RU: redis-ru:6379
    DB_EU: redis-eu:6379
    DB_ASIA: redis-asia:6379
    DataProtection__KeyPath: /keys
    ASPNETCORE_ENVIRONMENT: Production
    RabbitMQ__Host: rabbitmq
    RabbitMQ__User: valuator
    RabbitMQ__Password: valuator-local
  volumes:
    - shared-keys:/keys
  depends_on:
    redis-main:
      condition: service_healthy
    redis-ru:
      condition: service_healthy
    redis-eu:
      condition: service_healthy
    redis-asia:
      condition: service_healthy

x-worker: &worker
  build:
    context: .
    dockerfile: RankCalculator/Dockerfile
  environment:
    DB_MAIN: redis-main:6379
    DB_RU: redis-ru:6379
    DB_EU: redis-eu:6379
    DB_ASIA: redis-asia:6379
    RabbitMQ__Host: rabbitmq
    RabbitMQ__User: valuator
    RabbitMQ__Password: valuator-local
    ProcessingDelayMs: ${PROCESSING_DELAY_MS:-0}
  depends_on:
    redis-main:
      condition: service_healthy
    redis-ru:
      condition: service_healthy
    redis-eu:
      condition: service_healthy
    redis-asia:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

x-logger: &logger
  build:
    context: .
    dockerfile: EventsLogger/Dockerfile
  depends_on:
    rabbitmq:
      condition: service_healthy

services:
  eventslogger1:
    <<: *logger
    environment: &logger-environment
      RabbitMQ__Host: rabbitmq
      RabbitMQ__User: valuator
      RabbitMQ__Password: valuator-local
      SubscriberId: logger1

  eventslogger2:
    <<: *logger
    environment:
      <<: *logger-environment
      SubscriberId: logger2

  rabbitmq:
    image: rabbitmq:4-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: valuator
      RABBITMQ_DEFAULT_PASS: valuator-local
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  rankcalculator:
    <<: *worker

  redis-main:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6000:6379"
    volumes:
      - redis-main-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20

  redis-ru:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6001:6379"
    volumes:
      - redis-ru-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20

  redis-eu:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6002:6379"
    volumes:
      - redis-eu-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20

  redis-asia:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6003:6379"
    volumes:
      - redis-asia-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20

  app1:
    <<: *app
    environment:
      <<: *environment
      ASPNETCORE_URLS: http://+:5001
      InstanceName: app1
    ports:
      - "127.0.0.1:5001:5001"

  app2:
    <<: *app
    environment:
      <<: *environment
      ASPNETCORE_URLS: http://+:5002
      InstanceName: app2
    ports:
      - "127.0.0.1:5002:5002"

  app3:
    <<: *app
    profiles: [extra]
    environment:
      <<: *environment
      ASPNETCORE_URLS: http://+:5003
      InstanceName: app3
    ports:
      - "127.0.0.1:5003:5003"

  nginx:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf/${LB_METHOD:-round_robin}.conf:/etc/nginx/balancing.conf:ro
      - ./nginx/conf/${LB_REPLICAS:-two}.conf:/etc/nginx/extra-servers.conf:ro
    depends_on:
      - app1
      - app2

volumes:
  redis-main-data:
  redis-ru-data:
  redis-eu-data:
  redis-asia-data:
  shared-keys:
  rabbitmq-data:
