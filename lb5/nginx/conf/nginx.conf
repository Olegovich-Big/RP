worker_processes 1;
events { worker_connections 1024; }

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    log_format upstream_log '$remote_addr "$request" $status upstream=$upstream_addr';
    access_log /var/log/nginx/access.log upstream_log;

    upstream backend {
        # Round-robin is the default. The script selects another method via this include.
        include /etc/nginx/balancing.conf;
        server app1:5001 max_fails=1 fail_timeout=5s;
        server app2:5002 max_fails=1 fail_timeout=5s;
        include /etc/nginx/extra-servers.conf;
    }

    server {
        listen 8080;
        server_name localhost;
        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 1s;
            proxy_read_timeout 120s;
            # Do not enable non_idempotent: replaying a POST could change similarity.
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
        }
    }
}
